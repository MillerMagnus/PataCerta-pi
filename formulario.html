<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Mogra&display=swap" rel="stylesheet">

    <script src="script.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pata Certa</title>
</head>
<body>

<header class="homeHeader">
    <h1 class="caveat-700">Pata Certa</h1>
        <h2 class="caveat-400">O lugar perfeito para encontrar um novo amigo</h2> 
        <div class="limite"></div>
        <a href="home.html" class="marca">
        <span class="marca-pata" aria-hidden="true">🐾</span></a>
    </div>
</header>

<main>

    <section>
        <article>
            <form action="formulario.html" method="post" class="formulario">
                <h1>Formulário de Adoção</h1>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>

                <label for="animal">Animal de Interesse:</label>
                <select id="animal" name="animal" required>
                    <option value="">Selecione um animal</option>
                    <option value="nao-especifico">Não específico</option>
                    <option value="cachorros">Cachorros</option>
                    <option value="gatos">Gatos</option>
                    <option value="coelho">Coelho</option>
                    <!-- Adicione mais opções conforme necessário -->
                </select>

                <label for="" > :</label>
                <input type=""



                <label for="termo">Eu li e aceito os termos de adoção.</label>
                <input type="checkbox" id="termo" name="termo" required>

                <button type="submit">Enviar Solicitação</button>
        </article>
    </section>

</main>
<footer class="rodape">
    <div class="limite">
        <div class="pilha">
        <strong>Pata Certa</strong>
        <p class="texto-suave">Portal de adoção responsável de animais.</p>
        </div>
        <nav aria-label="Links do rodapé">
            <ul class="pilha">
            <li><a href="catalogo.html" style="color: #eac9c9;">Ver catálogo</a></li>
            <br>
            <li><a href="solicitacoes.html" style="color: #eac9c9;">Minhas solicitações</a></li>
            </ul>
        </nav>
        <p style="color: #ffff;">&copy; 2026 Pata Certa.</p>
    </div>
</footer>
</body>
</html>
